<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <input type="text" id="nome" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <button type="button" id="enviar">Entrar</button>
    <a href="./cadastro.html">Cadastrar</a>

    <script>
        const api = 'http://localhost:3000';
        document.querySelector('#enviar').addEventListener('click', async () => {
            const datas = {
                user: document.querySelector('#nome').value, 
                password: document.querySelector("#senha").value
            };

            try {
                const resposta = await fetch(`${api}/login`, {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify(datas)
                });

                if (resposta.status === 200) {
                    alert("Seja bem-vindo!");
                    localStorage.setItem('nome', document.querySelector('#nome').value);
                    window.location.href = './index.html';
                } else {
                    alert('Usuário ou senha incorretos');
                }
            } catch (erro) {
                alert('Erro ao conectar com o servidor');
            }
        });
    </script>
</body>
</html>
