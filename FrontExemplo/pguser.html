<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página do Usuário</title>
</head>
<body>
    <dialog id="cadCarro">
        <button type="button" onclick="document.getElementById('cadCarro').close()">Fechar</button>
        <form id="formVeiculo">
            <input type="hidden" id="id" value="1">
            <input type="text" placeholder="Marca" id="marca" required>
            <input type="text" placeholder="Modelo" id="modelo" required>
            <input type="text" placeholder="Cor" id="cor" required>
            <input type="text" placeholder="Placa" id="placa" required>
            <input type="number" placeholder="Ano" id="ano" required>
            <button type="submit">Cadastrar Veículo</button>
        </form>
    </dialog>

    <button onclick="document.getElementById('cadCarro').showModal()">Cadastrar Veículo</button>

    <script src="./usercadastrovei.js"></script>
</body>
</html>
